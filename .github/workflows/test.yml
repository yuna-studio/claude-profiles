name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test.sh
      - if: runner.os == 'macOS'
        run: /bin/bash tests/test.sh   # stock bash 3.2
      - if: runner.os == 'Linux'
        run: shellcheck -S warning ccp install.sh tests/test.sh
